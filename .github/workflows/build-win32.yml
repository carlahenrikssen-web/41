name: build-win32-exe
on:
  push:
  workflow_dispatch:

jobs:
  crossbuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install i686 cross toolchain
        run: |
          exec > >(tee apt.log) 2>&1
          sudo apt-get update -o Acquire::Retries=3 || echo "APT_UPDATE_NONFATAL"
          sudo apt-get install -y --no-install-recommends --fix-missing \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            autoconf automake libtool pkg-config make git curl wget \
            xz-utils pkgconf perl ca-certificates || echo "APT_INSTALL_NONFATAL"

          echo "=== which i686 compiler ==="
          which i686-w64-mingw32-gcc || echo "NO_COMPILER"
          i686-w64-mingw32-gcc --version 2>&1 | head -2 || true

          echo "=== mingw candidates available ==="
          apt-cache search mingw 2>/dev/null | head -20 || true

          if ! command -v i686-w64-mingw32-gcc >/dev/null 2>&1; then
            echo "::error::i686-w64-mingw32-gcc is still missing after install"
            exit 1
          fi

      - name: Build dependency stack for Windows 32-bit
        run: bash build-win32.sh 2>&1 | tee build-win32.log

      - name: Compile tr4mpass.exe
        run: bash build-tr4mpass-win32.sh 2>&1 | tee tr4mpass-build.log

      - name: Show what was produced
        if: always()
        run: |
          ls -l tr4mpass.exe || echo "NO_EXE"
          file tr4mpass.exe 2>/dev/null || true
          ls -l win32dll/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-output
          path: |
            tr4mpass.exe
            win32dll/*.dll
            apt.log
            build-win32.log
            tr4mpass-build.log
