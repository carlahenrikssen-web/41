name: probe-win32
on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: base-devel make pkg-config

      - name: Probe i686 packages
        run: |
          {
            echo "gcc target: $(gcc -dumpmachine)"
            echo "uname: $(uname -s -m)"
            echo "repos: $(pacman-conf --repo-list | tr '\n' ' ')"
            for p in mingw-w64-i686-toolchain mingw-w64-i686-pkgconf \
                     mingw-w64-i686-libimobiledevice mingw-w64-i686-libirecovery \
                     mingw-w64-i686-libusb mingw-w64-i686-libplist \
                     mingw-w64-i686-openssl mingw-w64-i686-curl \
                     mingw-w64-i686-libssh2; do
              if pacman -Si "$p" >/dev/null 2>&1; then
                echo "FOUND|$p|$(pacman -Si "$p" | awk -F': *' '/^Version/{print $2; exit}')"
              else
                echo "MISSING|$p|-"
              fi
            done
          } | tee probe-results.txt

          echo '## Probe results' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '| status | package | version |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          awk -F'|' '{printf "| %s | %s | %s |\n", $1, $2, $3}' probe-results.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-results
          path: probe-results.txt
