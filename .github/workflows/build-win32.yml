name: build-win32-exe
on:
  push:
  workflow_dispatch:

jobs:
  crossbuild:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install i686 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 \
            autoconf automake libtool pkg-config make git curl wget \
            xz-utils pkgconf perl

      - name: Build dependency stack for Windows 32-bit
        run: bash build-win32.sh 2>&1 | tee build-win32.log

      - name: Compile tr4mpass.exe
        run: bash build-tr4mpass-win32.sh 2>&1 | tee tr4mpass-build.log

      - name: Show what was produced
        if: always()
        run: |
          ls -l tr4mpass.exe || true
          file tr4mpass.exe || true
          ls -l win32dll/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-output
          path: |
            tr4mpass.exe
            win32dll/*.dll
            build-win32.log
            tr4mpass-build.log
